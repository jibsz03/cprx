<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Checker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains+Mono', monospace; background-color: #050505; color: #d1d5db; }
        .cyber-border { border: 1px solid #1f2937; }
        .cyber-input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-sm">
    <div class="max-w-3xl mx-auto">
        <div class="flex items-center space-x-3 mb-8">
            <i data-lucide="shield-check" class="text-blue-500 w-8 h-8"></i>
            <h1 class="text-xl font-bold tracking-tighter text-white uppercase">Proxy <span class="text-blue-500">Diagnostics</span></h1>
        </div>

        <div class="bg-zinc-900/50 p-5 rounded-lg cyber-border mb-6">
            <textarea id="proxyInput" class="w-full h-32 bg-black/50 cyber-input p-4 rounded text-blue-400 placeholder-gray-800 mb-4" placeholder="1.2.3.4:443"></textarea>
            <button onclick="check()" id="btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded flex items-center justify-center space-x-2 transition-all">
                <i data-lucide="zap" class="w-4 h-4"></i><span>START SCAN</span>
            </button>
        </div>

        <div id="resArea" class="hidden space-y-3">
            <div id="list" class="grid gap-2"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        async function check() {
            const val = document.getElementById('proxyInput').value.trim();
            if(!val) return;
            const btn = document.getElementById('btn');
            btn.disabled = true; btn.innerHTML = 'SCANNING...';
            
            try {
                // PERBAIKAN: Memanggil /api/check bukan /
                const r = await fetch(`/api/check?ip=${val.replace(/\n/g, ',')}`);
                const data = await r.json();
                const list = Array.isArray(data) ? data : [data];
                
                document.getElementById('resArea').classList.remove('hidden');
                document.getElementById('list').innerHTML = list.map(item => `
                    <div class="p-3 rounded border ${item.proxyip ? 'border-green-900/50 bg-green-950/10' : 'border-red-900/50 bg-red-950/10'} flex justify-between items-center">
                        <div>
                            <div class="font-bold text-white">${item.proxy}:${item.port}</div>
                            <div class="text-[10px] text-gray-500">${item.ip || 'DEAD'}</div>
                        </div>
                        <div class="text-right">
                            <div class="${item.proxyip ? 'text-green-500' : 'text-red-500'} font-bold">${item.delay || 'ERROR'}</div>
                            <div class="text-[10px] text-gray-600">${item.country || '-'}</div>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            } catch(e) { alert('Error: ' + e.message); }
            finally { btn.disabled = false; btn.innerHTML = 'START SCAN'; lucide.createIcons(); }
        }
    </script>
</body>
</html>
